<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Мои деньги</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--in:#16a34a;--out:#dc2626;--accent:#2563eb;--line:#e5e7eb}
@media (prefers-color-scheme:dark){:root{--bg:#0b1120;--card:#111827;--text:#f3f4f6;--muted:#9ca3af;--in:#4ade80;--out:#f87171;--accent:#60a5fa;--line:#1f2937}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:96px}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.muted{color:var(--muted);font-size:14px}
.in{color:var(--in)}.out{color:var(--out)}
h2{font-size:16px;margin:0 0 8px}
.big{font-size:32px;font-weight:700;margin:2px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button,input,select{font:inherit;color:inherit}
.btn{border:0;border-radius:14px;padding:14px;font-weight:600;font-size:17px;color:#fff;width:100%}
.btn.in{background:var(--in);color:#fff}.btn.out{background:var(--out);color:#fff}
.btn.main{background:var(--accent);color:#fff}
.btn.ghost{background:var(--line);color:var(--text)}
.btn.small{padding:8px 12px;font-size:14px;width:auto;border-radius:10px}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-top:4px;font-size:16px}
label{display:block;margin-top:10px;font-size:14px;color:var(--muted)}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:8px}
.item:last-child{border-bottom:0}
.item .l{min-width:0}.item .t{font-weight:600}
.item .n{white-space:nowrap;font-weight:700}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:none;border:0;padding:12px 4px;font-size:13px;color:var(--muted)}
.nav button span{display:block;font-size:22px}
.nav button.on{color:var(--accent);font-weight:600}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet-bg.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px 16px 24px;max-height:92vh;overflow:auto}
.bar{height:8px;border-radius:4px;background:var(--out);margin-top:4px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:10px;border:0;border-radius:10px;background:var(--line);font-weight:600}
.tabs button.on{background:var(--accent);color:#fff}
.hidden{display:none}
.empty{text-align:center;color:var(--muted);padding:18px 0}
.paid{opacity:.5}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<nav class="nav">
  <button data-v="home" class="on"><span>🏠</span>Главная</button>
  <button data-v="salary"><span>💼</span>ЗП</button>
  <button data-v="debts"><span>🤝</span>Долги</button>
  <button data-v="stats"><span>📊</span>Итоги</button>
  <button data-v="more"><span>⚙️</span>Ещё</button>
</nav>

<div class="sheet-bg" id="bg"><div class="sheet" id="sheet"></div></div>
<input type="file" id="file" accept="application/json" class="hidden">

<script>
const KEY='money-app-v1';
const IN_CATS=['Основная работа','Подработка','Чаевые','Другое'];
const OUT_CATS=['Еда','Транспорт','Жильё','Связь','Здоровье','Одежда','Развлечения','Другое'];
let S={tx:[],debts:[],shifts:[],advances:[],positions:[],closed:{},lastBackup:null};
let view='home', month=new Date().toISOString().slice(0,7);

try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){alert('Не удалось сохранить данные в браузере')}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const fmt=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(n)+' ₽';
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dshort=d=>{const [y,m,dd]=d.split('-');return dd+'.'+m};
const monthName=m=>{const [y,mm]=m.split('-');return new Date(y,mm-1,1).toLocaleDateString('ru-RU',{month:'long',year:'numeric'})};
const sum=a=>a.reduce((s,x)=>s+x.amount,0);

function render(){
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  const app=document.getElementById('app');
  app.innerHTML={home:rHome,salary:rSalary,debts:rDebts,stats:rStats,more:rMore}[view]();
}

function monthTx(){return S.tx.filter(t=>t.date.startsWith(month)).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id))}
function monthPicker(){return `<div class="card"><input type="month" value="${month}" onchange="month=this.value||month;render()"></div>`}

function rHome(){
  const all=S.tx, bal=sum(all.filter(t=>t.type==='in'))-sum(all.filter(t=>t.type==='out'));
  const mt=monthTx(), inc=sum(mt.filter(t=>t.type==='in')), exp=sum(mt.filter(t=>t.type==='out'));
  return `
  <div class="card"><div class="muted">Сейчас на руках (по записям)</div>
    <div class="big ${bal<0?'out':''}">${fmt(bal)}</div></div>
  <div class="grid2" style="margin-bottom:12px">
    <button class="btn in" onclick="openTx('in')">+ Доход</button>
    <button class="btn out" onclick="openTx('out')">− Расход</button>
  </div>
  ${monthPicker()}
  <div class="grid2">
    <div class="card"><div class="muted">Доход</div><div class="in" style="font-weight:700;font-size:20px">${fmt(inc)}</div></div>
    <div class="card"><div class="muted">Расход</div><div class="out" style="font-weight:700;font-size:20px">${fmt(exp)}</div></div>
  </div>
  <div class="card"><h2>Операции · ${monthName(month)}</h2>
  ${mt.length?mt.map(t=>`<div class="item" onclick="openTx('${t.type}','${t.id}')">
    <div class="l"><div class="t">${esc(t.cat)}</div><div class="muted">${dshort(t.date)}${t.note?' · '+esc(t.note):''}</div></div>
    <div class="n ${t.type}">${t.type==='in'?'+':'−'}${fmt(t.amount)}</div></div>`).join(''):'<div class="empty">Пока пусто. Нажми «+ Доход» или «− Расход»</div>'}
  </div>`;
}

function rDebts(){
  const left=d=>d.amount-(d.paid||0);
  const act=S.debts.filter(d=>left(d)>0.001), done=S.debts.filter(d=>left(d)<=0.001);
  const owe=act.filter(d=>d.dir==='owe').reduce((s,d)=>s+left(d),0);
  const lent=act.filter(d=>d.dir==='lent').reduce((s,d)=>s+left(d),0);
  const item=d=>`<div class="item ${left(d)<=0.001?'paid':''}">
    <div class="l" onclick="openDebt('${d.id}')"><div class="t">${esc(d.who)}</div>
    <div class="muted">${dshort(d.date)}${d.note?' · '+esc(d.note):''}${d.paid?' · возвращено '+fmt(d.paid):''}</div></div>
    <div style="text-align:right"><div class="n ${d.dir==='owe'?'out':'in'}">${fmt(left(d))}</div>
    ${left(d)>0.001?`<button class="btn small ghost" onclick="payDebt('${d.id}')">${d.dir==='owe'?'Отдал':'Вернули'}</button>`:''}</div></div>`;
  return `
  <div class="grid2" style="margin-bottom:12px">
    <div class="card" style="margin:0"><div class="muted">Я должен</div><div class="out" style="font-weight:700;font-size:20px">${fmt(owe)}</div></div>
    <div class="card" style="margin:0"><div class="muted">Мне должны</div><div class="in" style="font-weight:700;font-size:20px">${fmt(lent)}</div></div>
  </div>
  <button class="btn main" style="margin-bottom:12px" onclick="openDebt()">+ Новый долг</button>
  <div class="card"><h2>Активные</h2>${act.length?act.map(item).join(''):'<div class="empty">Долгов нет 🎉</div>'}</div>
  ${done.length?`<div class="card"><h2>Закрытые</h2>${done.map(item).join('')}</div>`:''}`;
}

function rStats(){
  const mt=monthTx(), exp=mt.filter(t=>t.type==='out'), inc=mt.filter(t=>t.type==='in');
  const by=(arr)=>{const m={};arr.forEach(t=>m[t.cat]=(m[t.cat]||0)+t.amount);return Object.entries(m).sort((a,b)=>b[1]-a[1])};
  const e=by(exp), i=by(inc), max=e.length?e[0][1]:1;
  const net=sum(inc)-sum(exp);
  return monthPicker()+`
  <div class="card"><div class="muted">Итог за месяц</div><div class="big ${net<0?'out':'in'}">${net>0?'+':''}${fmt(net)}</div></div>
  <div class="card"><h2>Откуда деньги</h2>${i.length?i.map(([c,v])=>`<div class="item"><span>${esc(c)}</span><b class="in">${fmt(v)}</b></div>`).join(''):'<div class="empty">Нет данных</div>'}</div>
  <div class="card"><h2>Куда уходят</h2>${e.length?e.map(([c,v])=>`<div style="margin:8px 0"><div class="row"><span>${esc(c)}</span><b>${fmt(v)}</b></div><div class="bar" style="width:${Math.max(4,v/max*100)}%"></div></div>`).join(''):'<div class="empty">Нет данных</div>'}</div>`;
}

function rMore(){
  const lb=S.lastBackup?new Date(S.lastBackup).toLocaleDateString('ru-RU'):'ещё не делалась';
  return `<div class="card"><h2>Резервная копия</h2>
  <p class="muted">Данные хранятся только в этом браузере на этом устройстве. Если очистить историю или сменить телефон, они пропадут. Сохраняй копию раз в неделю.<br>Последняя копия: ${lb}</p>
  <button class="btn main" onclick="exportData()" style="margin-bottom:8px">Скачать копию</button>
  <button class="btn ghost" onclick="document.getElementById('file').click()">Загрузить из копии</button></div>
  <div class="card"><h2>Как пользоваться</h2>
  <p class="muted">Каждый приход — «+ Доход» (выбери: основная работа, подработка или чаевые). Каждая трата — «− Расход». Заносить лучше в тот же день, пока помнишь. Долги ведутся отдельно во вкладке «Долги» и не влияют на баланс.</p></div>`;
}

/* ---------- sheet ---------- */
const bg=document.getElementById('bg'), sheet=document.getElementById('sheet');
bg.addEventListener('click',e=>{if(e.target===bg)closeSheet()});
function closeSheet(){bg.classList.remove('show')}
function showSheet(h){sheet.innerHTML=h;bg.classList.add('show')}

function openTx(type,id){
  const t=id?S.tx.find(x=>x.id===id):null;
  type=t?t.type:type;
  const cats=type==='in'?IN_CATS:OUT_CATS;
  showSheet(`<h2>${t?'Изменить':(type==='in'?'Новый доход':'Новый расход')}</h2>
  <label>Сумма</label><input id="f_amt" type="number" inputmode="decimal" step="any" placeholder="0" value="${t?t.amount:''}">
  <label>Категория</label><select id="f_cat">${cats.map(c=>`<option ${t&&t.cat===c?'selected':''}>${c}</option>`).join('')}</select>
  <label>Дата</label><input id="f_date" type="date" value="${t?t.date:today()}">
  <label>Заметка (необязательно)</label><input id="f_note" value="${t?esc(t.note):''}">
  <div style="margin-top:16px" class="grid2">
    <button class="btn ghost" onclick="closeSheet()">Отмена</button>
    <button class="btn ${type}" onclick="saveTx('${type}','${id||''}')">Сохранить</button></div>
  ${t?`<button class="btn small ghost out" style="margin-top:12px;width:100%" onclick="delTx('${id}')">Удалить запись</button>`:''}`);
  if(!t)setTimeout(()=>document.getElementById('f_amt').focus(),50);
}
function saveTx(type,id){
  const amount=parseFloat(String(document.getElementById('f_amt').value).replace(',','.'));
  if(!(amount>0)){alert('Введи сумму больше нуля');return}
  const rec={type,amount,cat:document.getElementById('f_cat').value,date:document.getElementById('f_date').value||today(),note:document.getElementById('f_note').value.trim()};
  if(id){Object.assign(S.tx.find(x=>x.id===id),rec)}else{S.tx.push(Object.assign({id:uid()},rec))}
  month=rec.date.slice(0,7);
  save();closeSheet();render();
}
function delTx(id){if(confirm('Удалить запись?')){S.tx=S.tx.filter(x=>x.id!==id);save();closeSheet();render()}}

function openDebt(id){
  const d=id?S.debts.find(x=>x.id===id):null;
  showSheet(`<h2>${d?'Изменить долг':'Новый долг'}</h2>
  <label>Кто</label><input id="d_who" value="${d?esc(d.who):''}" placeholder="Имя">
  <label>Тип</label><select id="d_dir"><option value="owe" ${d&&d.dir==='owe'?'selected':''}>Я должен</option><option value="lent" ${d&&d.dir==='lent'?'selected':''}>Мне должны</option></select>
  <label>Сумма</label><input id="d_amt" type="number" inputmode="decimal" step="any" value="${d?d.amount:''}">
  <label>Дата</label><input id="d_date" type="date" value="${d?d.date:today()}">
  <label>Заметка</label><input id="d_note" value="${d?esc(d.note):''}">
  <div style="margin-top:16px" class="grid2">
    <button class="btn ghost" onclick="closeSheet()">Отмена</button>
    <button class="btn main" onclick="saveDebt('${id||''}')">Сохранить</button></div>
  ${d?`<button class="btn small ghost out" style="margin-top:12px;width:100%" onclick="delDebt('${id}')">Удалить долг</button>`:''}`);
}
function saveDebt(id){
  const amount=parseFloat(String(document.getElementById('d_amt').value).replace(',','.'));
  const who=document.getElementById('d_who').value.trim();
  if(!who){alert('Укажи, кто');return}
  if(!(amount>0)){alert('Введи сумму больше нуля');return}
  const rec={who,amount,dir:document.getElementById('d_dir').value,date:document.getElementById('d_date').value||today(),note:document.getElementById('d_note').value.trim()};
  if(id){Object.assign(S.debts.find(x=>x.id===id),rec)}else{S.debts.push(Object.assign({id:uid(),paid:0},rec))}
  save();closeSheet();render();
}
function delDebt(id){if(confirm('Удалить долг?')){S.debts=S.debts.filter(x=>x.id!==id);save();closeSheet();render()}}
function payDebt(id){
  const d=S.debts.find(x=>x.id===id), left=d.amount-(d.paid||0);
  const v=prompt((d.dir==='owe'?'Сколько отдал':'Сколько вернули')+'? Осталось '+fmt(left),left);
  if(v===null)return;
  const a=parseFloat(String(v).replace(',','.'));
  if(!(a>0)){alert('Введи сумму больше нуля');return}
  d.paid=Math.min(d.amount,(d.paid||0)+a);
  save();render();
}

/* ---------- salary ---------- */
const tot=(a,k)=>a.reduce((s,x)=>s+(x[k]||0),0);
const num=v=>parseFloat(String(v).replace(',','.'))||0;

function rSalary(){
  const byDate=(a,b)=>b.date.localeCompare(a.date);
  const sh=S.shifts.filter(x=>x.date.startsWith(month)).sort(byDate);
  const ad=S.advances.filter(x=>x.date.startsWith(month)).sort(byDate);
  const pay=tot(sh,'pay'), tips=tot(sh,'tips'), adv=tot(ad,'amount'), due=pay-adv, c=S.closed[month];
  let ctrl='';
  if(c){
    const diff=c.received-c.expected;
    ctrl=`<div class="card"><h2>Месяц закрыт ✅</h2>
    <div class="item"><span>Ожидалось к выдаче</span><b>${fmt(c.expected)}</b></div>
    <div class="item"><span>Фактически получил</span><b>${fmt(c.received)}</b></div>
    <div class="item"><span>Разница</span><b class="${Math.abs(diff)<0.01?'in':(diff<0?'out':'in')}">${Math.abs(diff)<0.01?'всё сошлось':(diff>0?'+':'')+fmt(diff)}</b></div>
    ${diff<-0.01?'<p class="muted">Тебе недоплатили. Проверь смены и авансы.</p>':''}
    <button class="btn small ghost" style="margin-top:8px" onclick="reopenMonth()">Открыть месяц заново</button></div>`;
  }else{
    ctrl=`<button class="btn main" style="margin-bottom:12px" onclick="openClose()">Получил ЗП · закрыть месяц</button>`;
  }
  return monthPicker()+`
  <div class="card"><div class="muted">К получению (смены − авансы)</div><div class="big ${due<0?'out':''}">${fmt(due)}</div>
    <div class="muted">Начислено ${fmt(pay)} · авансы ${fmt(adv)}</div>
    <div class="muted">Чаевые за месяц: <b class="in">${fmt(tips)}</b> (в расчёт зарплаты не входят)</div></div>
  <div class="grid2" style="margin-bottom:12px">
    <button class="btn main" onclick="openShift()">+ Смена</button>
    <button class="btn ghost" onclick="openAdv()">+ Аванс</button>
  </div>
  ${ctrl}
  <div class="card"><h2>Смены · ${monthName(month)}</h2>
  ${sh.length?sh.map(x=>`<div class="item" onclick="openShift('${x.id}')"><div class="l"><div class="t">${dshort(x.date)}</div>
    <div class="muted">${x.tips?'чаевые '+fmt(x.tips):'без чаевых'}</div></div><div class="n in">${fmt(x.pay)}</div></div>`).join(''):'<div class="empty">Смен пока нет</div>'}</div>
  ${ad.length?`<div class="card"><h2>Авансы</h2>${ad.map(x=>`<div class="item" onclick="delAdv('${x.id}')"><div class="l"><div class="t">${dshort(x.date)}</div></div><div class="n out">−${fmt(x.amount)}</div></div>`).join('')}</div>`:''}
  <button class="btn ghost" onclick="openPos()">🧮 Позиции и ставки</button>`;
}

function openShift(id){
  const x=id?S.shifts.find(s=>s.id===id):null;
  const calc=(!x&&S.positions.length)?`<label>Калькулятор: сколько чего сделал</label>
    ${S.positions.map(p=>`<div class="row" style="margin-top:6px"><span>${esc(p.name)} <span class="muted">· ${fmt(p.rate)}</span></span>
    <input class="q" data-r="${p.rate}" type="number" inputmode="decimal" placeholder="0" style="width:90px;margin:0" oninput="calcPos()"></div>`).join('')}`:'';
  showSheet(`<h2>${x?'Изменить смену':'Новая смена'}</h2>
  <label>Дата</label><input id="s_date" type="date" value="${x?x.date:today()}">
  ${calc}
  <label>ЗП за смену (₽)</label><input id="s_pay" type="number" inputmode="decimal" step="any" value="${x?x.pay:''}">
  <label>Чаевые (₽)</label><input id="s_tips" type="number" inputmode="decimal" step="any" value="${x?x.tips||'':''}">
  <div style="margin-top:16px" class="grid2"><button class="btn ghost" onclick="closeSheet()">Отмена</button>
  <button class="btn main" onclick="saveShift('${id||''}')">Сохранить</button></div>
  ${x?`<button class="btn small ghost out" style="margin-top:12px;width:100%" onclick="delShift('${id}')">Удалить смену</button>`:''}`);
}
function calcPos(){
  let t=0;document.querySelectorAll('.q').forEach(i=>t+=num(i.value)*num(i.dataset.r));
  document.getElementById('s_pay').value=t?Math.round(t*100)/100:'';
}
function saveShift(id){
  const pay=num(document.getElementById('s_pay').value), tips=num(document.getElementById('s_tips').value);
  const date=document.getElementById('s_date').value||today();
  if(!(pay>0)&&!(tips>0)){alert('Введи ЗП за смену или чаевые');return}
  let x=id?S.shifts.find(s=>s.id===id):null;
  if(x){Object.assign(x,{date,pay,tips})}else{x={id:uid(),date,pay,tips};S.shifts.push(x)}
  S.tx=S.tx.filter(t=>t.ref!==x.id);
  if(tips>0)S.tx.push({id:uid(),type:'in',amount:tips,cat:'Чаевые',date,note:'Смена',ref:x.id});
  month=date.slice(0,7);save();closeSheet();render();
}
function delShift(id){if(confirm('Удалить смену?')){S.shifts=S.shifts.filter(x=>x.id!==id);S.tx=S.tx.filter(t=>t.ref!==id);save();closeSheet();render()}}

function openAdv(){
  showSheet(`<h2>Аванс</h2>
  <label>Дата</label><input id="a_date" type="date" value="${today()}">
  <label>Сумма (₽)</label><input id="a_amt" type="number" inputmode="decimal" step="any">
  <div style="margin-top:16px" class="grid2"><button class="btn ghost" onclick="closeSheet()">Отмена</button>
  <button class="btn main" onclick="saveAdv()">Сохранить</button></div>`);
}
function saveAdv(){
  const amount=num(document.getElementById('a_amt').value), date=document.getElementById('a_date').value||today();
  if(!(amount>0)){alert('Введи сумму больше нуля');return}
  const a={id:uid(),date,amount};S.advances.push(a);
  S.tx.push({id:uid(),type:'in',amount,cat:'Основная работа',date,note:'Аванс',ref:a.id});
  month=date.slice(0,7);save();closeSheet();render();
}
function delAdv(id){if(confirm('Удалить аванс?')){S.advances=S.advances.filter(x=>x.id!==id);S.tx=S.tx.filter(t=>t.ref!==id);save();render()}}

function openClose(){
  const due=tot(S.shifts.filter(x=>x.date.startsWith(month)),'pay')-tot(S.advances.filter(x=>x.date.startsWith(month)),'amount');
  showSheet(`<h2>Закрыть месяц</h2>
  <p class="muted">Ожидалось к выдаче (смены − авансы): <b>${fmt(due)}</b></p>
  <label>Сколько фактически получил (₽)</label><input id="c_amt" type="number" inputmode="decimal" step="any" value="${due>0?due:''}">
  <div style="margin-top:16px" class="grid2"><button class="btn ghost" onclick="closeSheet()">Отмена</button>
  <button class="btn main" onclick="saveClose(${due})">Закрыть</button></div>`);
}
function saveClose(expected){
  const received=num(document.getElementById('c_amt').value);
  S.closed[month]={expected,received,date:today()};
  S.tx=S.tx.filter(t=>t.ref!=='close-'+month);
  if(received>0)S.tx.push({id:uid(),type:'in',amount:received,cat:'Основная работа',date:today(),note:'Зарплата за '+monthName(month),ref:'close-'+month});
  save();closeSheet();render();
}
function reopenMonth(){if(confirm('Открыть месяц заново? Запись о полученной ЗП удалится из операций.')){delete S.closed[month];S.tx=S.tx.filter(t=>t.ref!=='close-'+month);save();render()}}

function openPos(){
  showSheet(`<h2>Позиции и ставки</h2><p class="muted">Что ты делаешь на смене и сколько платят за единицу. Используется в калькуляторе при добавлении смены.</p>
  ${S.positions.length?S.positions.map(p=>`<div class="item"><span>${esc(p.name)} · <b>${fmt(p.rate)}</b></span><button class="btn small ghost" onclick="delPos('${p.id}')">Удалить</button></div>`).join(''):'<div class="empty">Позиций нет</div>'}
  <label>Название</label><input id="p_name" placeholder="Например: доставка">
  <label>Заработок за 1 шт (₽)</label><input id="p_rate" type="number" inputmode="decimal" step="any">
  <div style="margin-top:16px" class="grid2"><button class="btn ghost" onclick="closeSheet()">Закрыть</button>
  <button class="btn main" onclick="addPos()">Добавить</button></div>`);
}
function addPos(){
  const name=document.getElementById('p_name').value.trim(), rate=num(document.getElementById('p_rate').value);
  if(!name||!(rate>0)){alert('Укажи название и ставку');return}
  S.positions.push({id:uid(),name,rate});save();openPos();
}
function delPos(id){S.positions=S.positions.filter(p=>p.id!==id);save();openPos()}

/* ---------- backup ---------- */
function exportData(){
  S.lastBackup=Date.now();save();
  const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='dengi-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);render();
}
document.getElementById('file').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const d=JSON.parse(r.result);
    if(!Array.isArray(d.tx)||!Array.isArray(d.debts))throw 0;
    if(confirm('Заменить текущие данные данными из копии?')){S=Object.assign({tx:[],debts:[],shifts:[],advances:[],positions:[],closed:{},lastBackup:null},d);save();render()}
  }catch(_){alert('Это не похоже на файл копии')}};
  r.readAsText(f);e.target.value='';
});

document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render();window.scrollTo(0,0)});
render();
</script>
</body>
</html>
